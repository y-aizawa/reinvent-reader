<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>re:Invent Reader</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #101114;
      color: #ffffff;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
    }

    .video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000000;
      overflow: hidden;
    }

    #player {
      width: 100%;
      height: 100%;
    }

    .lyrics {
      height: calc(100vh - 280px);
      min-height: 320px;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 100px 20px;
      scroll-behavior: smooth;
      overscroll-behavior: contain;
      touch-action: pan-y;
    }

    .line {
      display: block;
      width: 100%;
      margin: 0;
      padding: 14px 0;
      border: 0;
      outline: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.28);
      text-align: left;
      font-size: 21px;
      line-height: 1.45;
      font-weight: 700;
      cursor: pointer;
      transition:
        color 0.2s ease,
        font-size 0.2s ease;
    }

    .line:hover {
      color: rgba(255, 255, 255, 0.55);
    }

    .line.near {
      color: rgba(255, 255, 255, 0.58);
    }

    .line.active {
      color: #ffffff;
      font-size: 29px;
    }

    .info {
      padding: 10px 20px 16px;
      border-top: 1px solid #24262b;
      color: #92959d;
      font-size: 12px;
    }

    .loading {
      padding: 30px 20px;
      color: #92959d;
    }

    @media (max-width: 480px) {
      .lyrics {
        height: calc(100vh - 250px);
        min-height: 300px;
        padding: 100px 18px;
      }

      .line {
        font-size: 19px;
      }

      .line.active {
        font-size: 27px;
      }

      .info {
        padding-left: 18px;
        padding-right: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="video">
      <div id="player"></div>
    </div>

    <div id="lyrics" class="lyrics">
      <div class="loading">Transcriptを読み込んでいます...</div>
    </div>

    <div id="info" class="info">
      読み込み中...
    </div>

  </div>


  <script>

    const VIDEO_ID = "3Y1G9najGiI";

    let transcript = [];
    let player = null;
    let currentIndex = -1;


    /* =========================================================
       Transcript読み込み
    ========================================================= */

    async function loadTranscript() {

      try {

        const response =
          await fetch("./transcript.json");

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}`
          );
        }

        transcript =
          await response.json();


        if (!Array.isArray(transcript)) {
          throw new Error(
            "Transcript format is invalid."
          );
        }


        if (transcript.length === 0) {
          throw new Error(
            "Transcript is empty."
          );
        }


        renderLyrics(0);

      } catch (error) {

        console.error(error);

        document.getElementById("lyrics").innerHTML =
          `<div class="loading">
            Transcriptの読み込みに失敗しました。
          </div>`;

        document.getElementById("info").textContent =
          "Transcript error";

      }

    }


    /* =========================================================
       現在のセンテンスを取得
    ========================================================= */

    function getCurrentIndex(currentTime) {

      let index = 0;

      for (
        let i = 0;
        i < transcript.length;
        i++
      ) {

        if (
          transcript[i].start <= currentTime
        ) {

          index = i;

        } else {

          break;

        }

      }

      return index;

    }


    /* =========================================================
       Lyrics中央表示
    ========================================================= */

    function centerLine(
      container,
      element
    ) {

      if (!element) {
        return;
      }


      const target =
        element.offsetTop -
        (container.clientHeight / 2) +
        (element.offsetHeight / 2);


      const maxScroll =
        container.scrollHeight -
        container.clientHeight;


      const top =
        Math.max(
          0,
          Math.min(
            target,
            maxScroll
          )
        );


      container.scrollTo({

        top: top,

        behavior: "smooth"

      });

    }


    /* =========================================================
       Lyrics描画
    ========================================================= */

    function renderLyrics(index) {

      const container =
        document.getElementById("lyrics");


      container.innerHTML = "";


      transcript.forEach(
        (item, i) => {

          const button =
            document.createElement("button");


          button.type = "button";

          button.className = "line";


          if (i === index) {

            button.classList.add(
              "active"
            );

          }

          else if (
            Math.abs(i - index) === 1
          ) {

            button.classList.add(
              "near"
            );

          }


          button.textContent =
            item.text;


          button.addEventListener(
            "click",
            () => {

              if (!player) {
                return;
              }


              player.seekTo(
                item.start,
                true
              );


              player.playVideo();


              currentIndex = i;


              renderLyrics(i);

            }
          );


          container.appendChild(button);

        }
      );


      const active =
        container.querySelector(
          ".active"
        );


      centerLine(
        container,
        active
      );


      document.getElementById(
        "info"
      ).textContent =
        `Sentence ${index + 1} / ${transcript.length}`;

    }


    /* =========================================================
       YouTube API Ready
    ========================================================= */

    function onYouTubeIframeAPIReady() {

      player =
        new YT.Player(
          "player",
          {

            videoId: VIDEO_ID,

            playerVars: {

              playsinline: 1,

              rel: 0

            },

            events: {

              onReady: () => {

                if (
                  transcript.length > 0
                ) {

                  currentIndex = 0;

                  renderLyrics(0);

                }


                setInterval(
                  updateCurrentSentence,
                  250
                );

              }

            }

          }
        );

    }


    /* =========================================================
       現在センテンス更新
    ========================================================= */

    function updateCurrentSentence() {

      if (!player) {
        return;
      }


      if (
        player.getPlayerState() !==
        YT.PlayerState.PLAYING
      ) {

        return;

      }


      if (
        transcript.length === 0
      ) {

        return;

      }


      const currentTime =
        player.getCurrentTime();


      const index =
        getCurrentIndex(
          currentTime
        );


      if (
        index !== currentIndex
      ) {

        currentIndex = index;

        renderLyrics(index);

      }

    }


    /* =========================================================
       初期化
    ========================================================= */

    loadTranscript();


    /* =========================================================
       YouTube IFrame API
    ========================================================= */

    const script =
      document.createElement(
        "script"
      );


    script.src =
      "https://www.youtube.com/iframe_api";


    document.head.appendChild(
      script
    );

  </script>

</body>
</html>
