<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>re:Invent Reader</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101114;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    .app {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
    }

    .video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    #player {
      width: 100%;
      height: 100%;
    }

    .lyrics {
      height: calc(100vh - 360px);
      min-height: 360px;
      overflow-y: auto;
      padding: 80px 20px;
      scroll-behavior: smooth;
    }

    .line {
      display: block;
      width: 100%;
      border: 0;
      background: none;
      color: rgba(255,255,255,.28);
      text-align: left;
      font-size: 22px;
      line-height: 1.45;
      font-weight: 700;
      padding: 14px 0;
      cursor: pointer;
      transition: 0.2s;
    }

    .line.near {
      color: rgba(255,255,255,.58);
    }

    .line.active {
      color: #fff;
      font-size: 30px;
    }

    .info {
      padding: 12px 20px 18px;
      color: #999;
      font-size: 12px;
      border-top: 1px solid #24262b;
    }

    @media (max-width: 480px) {
      .line {
        font-size: 20px;
      }

      .line.active {
        font-size: 27px;
      }

      .lyrics {
        height: calc(100vh - 280px);
        min-height: 300px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="video">
      <div id="player"></div>
    </div>

    <div id="lyrics" class="lyrics"></div>

    <div id="info" class="info">
      読み込み中...
    </div>
  </div>

  <script>
    const VIDEO_ID = "3Y1G9najGiI";

    const transcript = [
      {
        start: 32.4,
        text: "AWS is changing the way we build applications."
      },
      {
        start: 38.1,
        text: "And today, I'm excited to announce some major new capabilities."
      },
      {
        start: 44.9,
        text: "We're introducing a new generation of Amazon Bedrock models."
      },
      {
        start: 53.2,
        text: "These capabilities make it easier to build with generative AI."
      },
      {
        start: 61.8,
        text: "And this is just the beginning of what we can do together."
      },
      {
        start: 71.5,
        text: "Let me show you what this looks like in practice."
      }
    ];

    let player = null;
    let currentIndex = -1;

    function getCurrentIndex(currentTime) {
      let index = 0;

      for (let i = 0; i < transcript.length; i++) {
        if (transcript[i].start <= currentTime) {
          index = i;
        } else {
          break;
        }
      }

      return index;
    }

    function renderLyrics(index) {
      const container = document.getElementById("lyrics");
      container.innerHTML = "";

      transcript.forEach((item, i) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "line";

        if (i === index) {
          button.classList.add("active");
        } else if (Math.abs(i - index) === 1) {
          button.classList.add("near");
        }

        button.textContent = item.text;

        button.addEventListener("click", () => {
          if (!player) return;

          player.seekTo(item.start, true);
          player.playVideo();

          currentIndex = i;
          renderLyrics(i);
        });

        container.appendChild(button);
      });

      const active = container.querySelector(".active");

      if (active) {
        active.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });
      }

      document.getElementById("info").textContent =
        `Sentence ${index + 1} / ${transcript.length}`;
    }

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("player", {
        videoId: VIDEO_ID,
        playerVars: {
          playsinline: 1,
          rel: 0
        },
        events: {
          onReady: () => {
            renderLyrics(0);
            setInterval(updateCurrentSentence, 250);
          }
        }
      });
    }

    function updateCurrentSentence() {
      if (!player) return;

      const state = player.getPlayerState();

      if (state !== YT.PlayerState.PLAYING) {
        return;
      }

      const currentTime = player.getCurrentTime();
      const index = getCurrentIndex(currentTime);

      if (index !== currentIndex) {
        currentIndex = index;
        renderLyrics(index);
      }
    }

    const script = document.createElement("script");
    script.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(script);
  </script>
</body>
</html>
