<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f2eea">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <title>re:Invent Reader</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #101114;
      --panel: #17191d;
      --panel2: #1d2025;
      --text: #fff;
      --muted: #9b9fa8;
      --border: #2a2d33;
      --accent: #8ab4ff;
    }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100vh; }
    .app { width: 100%; max-width: 760px; margin: 0 auto; padding: 36px 18px 56px; }
    .brand { margin-bottom: 34px; }
    .eyebrow { color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    h1 { font-size: 32px; line-height: 1.15; margin: 8px 0 10px; }
    .subtitle { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .section-title { font-size: 18px; margin: 0 0 14px; }
    .grid { display: grid; gap: 14px; }
    .card { display: block; text-decoration: none; color: inherit; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; transition: transform .15s ease, border-color .15s ease, background .15s ease; }
    .card:hover { transform: translateY(-1px); border-color: #3a3e46; background: var(--panel2); }
    .thumb { aspect-ratio: 16 / 9; background: #0b0c0f center / cover no-repeat; }
    .card-body { padding: 16px; }
    .tag { display: inline-block; color: var(--muted); font-size: 11px; margin-bottom: 8px; }
    .title { font-size: 18px; line-height: 1.4; font-weight: 700; }
    .desc { margin-top: 8px; font-size: 13px; color: var(--muted); line-height: 1.55; }
    .empty { padding: 24px; border: 1px dashed var(--border); border-radius: 14px; color: var(--muted); }
    .footer { margin-top: 30px; color: #777b84; font-size: 11px; }
    @media (max-width: 480px) {
      .app { padding: 26px 14px 42px; }
      h1 { font-size: 28px; }
      .title { font-size: 17px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="brand">
      <div class="eyebrow">English Listening Practice</div>
      <h1>re:Invent Reader</h1>
      <p class="subtitle">AWS re:Invent の動画を、センテンス単位で聞いて音読するためのプレイヤー。</p>
    </section>

    <section>
      <h2 class="section-title">Keynotes</h2>
      <div id="videoList" class="grid">
        <div class="empty">動画一覧を読み込んでいます...</div>
      </div>
    </section>

    <div class="footer">動画を選ぶと、Transcript Reader が開きます。</div>
  </main>

  <script>
    async function loadVideos() {
      const list = document.getElementById('videoList');
      try {
        const response = await fetch('./videos.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const videos = await response.json();
        if (!Array.isArray(videos) || videos.length === 0) {
          list.innerHTML = '<div class="empty">動画が登録されていません。</div>';
          return;
        }
        list.innerHTML = '';
        for (const video of videos) {
          const card = document.createElement('a');
          card.className = 'card';
          card.href = `reader.html?video=${encodeURIComponent(video.key)}`;

          const thumb = document.createElement('div');
          thumb.className = 'thumb';
          thumb.style.backgroundImage = `url("https://i.ytimg.com/vi/${encodeURIComponent(video.id)}/hqdefault.jpg")`;

          const body = document.createElement('div');
          body.className = 'card-body';

          const tag = document.createElement('div');
          tag.className = 'tag';
          tag.textContent = video.category || 'AWS re:Invent';

          const title = document.createElement('div');
          title.className = 'title';
          title.textContent = video.title;

          body.append(tag, title);
          if (video.description) {
            const desc = document.createElement('div');
            desc.className = 'desc';
            desc.textContent = video.description;
            body.appendChild(desc);
          }

          card.append(thumb, body);
          list.appendChild(card);
        }
      } catch (error) {
        console.error(error);
        list.innerHTML = '<div class="empty">動画一覧の読み込みに失敗しました。</div>';
      }
    }
    loadVideos();
  </script>
</body>
</html>
