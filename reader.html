<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f2eea">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <title>re:Invent Reader</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #101114; color: #fff; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { overflow-x: hidden; }
    .app { width: 100%; max-width: 640px; margin: 0 auto; }
    .topbar { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #24262b; background: #151619; }
    .back { color: #fff; text-decoration: none; font-size: 13px; }
    .title { min-width: 0; flex: 1; color: #c9ccd2; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .video { width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; }
    #player { width: 100%; height: 100%; }
    .lyrics { height: calc(100vh - 320px); min-height: 320px; overflow-y: auto; overflow-x: hidden; padding: 100px 20px; scroll-behavior: smooth; overscroll-behavior: contain; touch-action: pan-y; }
    .line { display: block; width: 100%; margin: 0; padding: 14px 0; border: 0; outline: none; background: transparent; color: rgba(255,255,255,.28); text-align: left; font-size: 21px; line-height: 1.45; font-weight: 700; cursor: pointer; transition: color .2s ease, font-size .2s ease; }
    .line.near { color: rgba(255,255,255,.58); }
    .line.active { color: #fff; font-size: 29px; }
    .info { padding: 10px 20px 16px; border-top: 1px solid #24262b; color: #92959d; font-size: 12px; }
    .loading { padding: 30px 20px; color: #92959d; }
    @media (max-width: 480px) {
      .lyrics { height: calc(100vh - 250px); min-height: 300px; padding: 100px 18px; }
      .line { font-size: 19px; }
      .line.active { font-size: 27px; }
      .info { padding-left: 18px; padding-right: 18px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <a class="back" href="./index.html">‹ Videos</a>
      <div id="videoTitle" class="title">Loading...</div>
    </div>
    <div class="video"><div id="player"></div></div>
    <div id="lyrics" class="lyrics"><div class="loading">Transcriptを読み込んでいます...</div></div>
    <div id="info" class="info">読み込み中...</div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const videoKey = params.get('video');
    const state = { videos: [], currentVideo: null, transcript: [], player: null, currentIndex: -1 };

    async function loadData() {
      const [videosResponse] = await Promise.all([
        fetch('./videos.json', { cache: 'no-store' })
      ]);
      if (!videosResponse.ok) throw new Error(`videos.json: HTTP ${videosResponse.status}`);
      state.videos = await videosResponse.json();
      state.currentVideo = state.videos.find(v => v.key === videoKey);
      if (!state.currentVideo) throw new Error('Video not found');
      document.getElementById('videoTitle').textContent = state.currentVideo.title;

      const transcriptResponse = await fetch(`./${state.currentVideo.transcript}`, { cache: 'no-store' });
      if (!transcriptResponse.ok) throw new Error(`transcript: HTTP ${transcriptResponse.status}`);
      state.transcript = await transcriptResponse.json();
      if (!Array.isArray(state.transcript) || state.transcript.length === 0) throw new Error('Transcript is empty');
    }

    function getCurrentIndex(time) {
      let index = 0;
      for (let i = 0; i < state.transcript.length; i++) {
        if (Number(state.transcript[i].start) <= time) index = i;
        else break;
      }
      return index;
    }

    function moveCurrentLine(container, element) {
      if (!element) return;

      // 実際に表示されている位置を使って、現在文の上端を
      // 歌詞表示エリアの上から約25%に合わせる。
      const containerRect = container.getBoundingClientRect();
      const elementRect = element.getBoundingClientRect();

      const targetY =
        containerRect.top + (container.clientHeight * 0.25);

      // 現在の字幕の「上端」を表示エリアの25%位置に合わせる。
      // 中心を合わせると、2行以上の字幕が上にはみ出すことがあるため。
      const scrollAmount =
        elementRect.top - targetY;

      const maxScroll =
        container.scrollHeight - container.clientHeight;

      const nextScrollTop = Math.max(
        0,
        Math.min(
          container.scrollTop + scrollAmount,
          maxScroll
        )
      );

      // smoothではなく即時移動。
      // 再生中に文が切り替わるたびにアニメーションを重ねると、
      // 現在文が一時的に画面外へ出ることがあるため。
      container.scrollTo({
        top: nextScrollTop,
        behavior: 'auto'
      });
    }

    function renderLyrics(index) {
      const container = document.getElementById('lyrics');
      container.innerHTML = '';
      state.transcript.forEach((item, i) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'line';
        if (i === index) button.classList.add('active');
        else if (Math.abs(i - index) === 1) button.classList.add('near');
        button.textContent = item.text || item.en || '';
        button.addEventListener('click', () => {
          if (!state.player) return;
          state.player.seekTo(Number(item.start), true);
          state.player.playVideo();
          state.currentIndex = i;
          renderLyrics(i);
        });
        container.appendChild(button);
      });
      // DOM反映後に実際の表示位置を測ってスクロールする。
      requestAnimationFrame(() => {
        moveCurrentLine(
          container,
          container.querySelector('.active')
        );
      });

      document.getElementById('info').textContent = `Sentence ${index + 1} / ${state.transcript.length}`;
    }

    function onYouTubeIframeAPIReady() {
      state.player = new YT.Player('player', {
        videoId: state.currentVideo.id,
        playerVars: { playsinline: 1, rel: 0 },
        events: {
          onReady: () => {
            state.currentIndex = 0;
            renderLyrics(0);
            setInterval(updateCurrentSentence, 250);
          }
        }
      });
    }

    function updateCurrentSentence() {
      if (!state.player || state.player.getPlayerState() !== YT.PlayerState.PLAYING || state.transcript.length === 0) return;
      const index = getCurrentIndex(state.player.getCurrentTime());
      if (index !== state.currentIndex) {
        state.currentIndex = index;
        renderLyrics(index);
      }
    }

    (async () => {
      try {
        if (!videoKey) throw new Error('Missing video parameter');
        await loadData();
        const script = document.createElement('script');
        script.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(script);
      } catch (error) {
        console.error(error);
        document.getElementById('lyrics').innerHTML = '<div class="loading">動画またはTranscriptの読み込みに失敗しました。</div>';
        document.getElementById('info').textContent = 'Load error';
      }
    })();
  </script>
</body>
</html>
