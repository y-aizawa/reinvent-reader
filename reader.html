<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f2eea">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./reader.css">
  <title>re:Invent Reader</title>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <a class="back" href="./index.html">‹ Videos</a>
      <div id="videoTitle" class="title">Loading...</div>
    </div>
    <div class="video"><div id="player"></div></div>
    <div id="lyrics" class="lyrics"><div class="loading">Transcriptを読み込んでいます...</div></div>
    <div id="info" class="info">読み込み中...</div>
  </div>

  <div class="bottom-controls">
    <button id="modeButton" class="mode-button" type="button" aria-label="再生モード切替">連続</button>
    <button id="playbackButton" class="playback-button" type="button" aria-label="再生">
      <span id="playbackIcon" class="playback-icon" aria-hidden="true"></span>
    </button>
    <button id="languageButton" class="language-button" type="button" aria-label="字幕言語切替">EN</button>
  </div>

  <script src="./reader.js"></script>
</body>
</html>
