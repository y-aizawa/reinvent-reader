<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f2eea">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./reader.css">
  <title>re:Invent Reader</title>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <a class="back" href="./index.html">‹ Videos</a>
      <div id="videoTitle" class="title">Loading...</div>
    </div>
    <div class="video"><div id="player"></div></div>
    <div id="lyrics" class="lyrics"><div class="loading">Transcriptを読み込んでいます...</div></div>
    <div id="info" class="info">読み込み中...</div>
  </div>

  <div class="bottom-controls">
    <div class="mode-toggle" role="group" aria-label="再生モード">\n      <button class="mode-button active" type="button" data-mode="continuous">連続</button>\n      <button class="mode-button" type="button" data-mode="pause">ポーズ付き</button>\n    </div>
    <button id="playbackButton" class="playback-button" type="button" aria-label="再生">
      <span id="playbackIcon" class="playback-icon" aria-hidden="true"></span>
    </button>
    <div class="language-toggle" role="group" aria-label="字幕言語">
      <button class="language-button active" type="button" data-language="en">EN</button>
      <button class="language-button" type="button" data-language="ja">日本語</button>
    </div>
  </div>

  <script src="./reader.js"></script>
</body>
</html>
